# Phase 2 — Local Development Infrastructure
# =============================================
# Starts: Zookeeper, Kafka, Redis, and Kafka UI (Provectus)
#
# Usage:
#   docker compose -f ml/docker-compose.yml up -d
#   docker compose -f ml/docker-compose.yml down
#
# Exposed ports (all localhost-only):
#   Kafka:     9092  (KafkaJS / kafka-python connect here)
#   Redis:     6379  (FeatureStore + consumer dedup)
#   Kafka UI:  8080  (browser at http://localhost:8080 — inspect topics/messages)
#
# Topics are auto-created by the KafkaJS producer and Python consumer.
# For production, pre-create topics with explicit replication + partition counts.

version: '3.8'

services:

  # ── Zookeeper ─────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: clinictrust-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka broker ──────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: clinictrust-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENERS:                        PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              168        # 7 days
      KAFKA_LOG_SEGMENT_BYTES:                1073741824 # 1 GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS:  300000
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: clinictrust-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  # Open http://localhost:8080 in a browser to:
  #   - Browse topics and partition offsets
  #   - Inspect individual messages (JSON pretty-printed)
  #   - Check consumer group lag
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: clinictrust-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME:            clinictrust-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED:           "true"

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  redis_data:
